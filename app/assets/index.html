          btn.addEventListener('click', () => {

          });
        });
      }
    }

    // Update stats

  function updateStats() {
    const total = records.length;
    const counts = {};
    STATUSES.forEach(s => counts[s] = 0);
    records.forEach(r => { if (counts[r.status] !== undefined) counts[r.status]++; });

    const offerCount = counts['等offer'] || 0;
    const activeCount = records.filter(r => !['挂', '等offer'].includes(r.status)).length;

    document.getElementById('statsRow').innerHTML = `
      <div class="stat-tile"><span class="stat-value">${total}</span><span class="stat-label">总投递</span></div>
      <div class="stat-tile"><span class="stat-value" style="color:var(--status-warning)">${activeCount}</span><span class="stat-label">进行中</span></div>
      <div class="stat-tile"><span class="stat-value" style="color:var(--status-good)">${offerCount}</span><span class="stat-label">等 offer</span></div>
      <div class="stat-tile"><span class="stat-value" style="color:var(--status-critical)">${counts['挂'] || 0}</span><span class="stat-label">已挂</span></div>
    `;

    renderRhythm();
  }

  // ===== 投递节奏（侧边栏子模块 · 极简）：近 7 日柱状 =====
  function renderRhythm() {
    const dayCount = {};   // 日期(yyyy-mm-dd) -> 数量
    records.forEach(r => {
      if (r.date) dayCount[r.date] = (dayCount[r.date] || 0) + 1;
    });

    const today = new Date();
    const days = [];
    for (let i = 6; i >= 0; i--) {
      const t = new Date(today);
      t.setDate(today.getDate() - i);
      const key = toDateKey(t);
      days.push({ key, count: dayCount[key] || 0, dow: t.getDay() });
    }
    const bars = document.getElementById('sbRhythmBars');
    const sum = document.getElementById('sbRhythmSum');
    if (!bars) return;
    const maxC = Math.max(1, ...days.map(d => d.count));
    bars.innerHTML = days.map(d =>
      `<div class="rb ${d.count === 0 ? 'zero' : ''}" style="height:${Math.round(d.count / maxC * 100)}%" title="${monthDay(d.key)}（周${'日一二三四五六'[d.dow]}）：投递 ${d.count} 次"></div>`
    ).join('');
    const daysEl = document.getElementById('svRhythmDays');
    if (daysEl) daysEl.innerHTML = days.map(d => `<span>周${'日一二三四五六'[d.dow]}</span>`).join('');
    const total = days.reduce((a, d) => a + d.count, 0);
    sum.textContent = `近7日投递 ${total} 次`;
  }

  function toDateKey(d) {
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    return `${y}-${m}-${day}`;
  }
  function isTodayKey(key) { return key === toDateKey(new Date()); }
  function monthDay(key) {
    const p = key.split('-');
    return `${p[1]}/${p[2]}`;
  }

  function renderStatusKeyDots() {

    }).join('');
  }


  function esc(str) {
    if (!str) return '';
    const d = document.createElement('div');
    d.textContent = str;

  // 把文本中的 http(s) 链接渲染成可点击链接（先转义再串回）
  function linkifyText(str) {

    const escaped = esc(str);
    return escaped.replace(
      /(https?:\/\/[^\s]+)/g,

    );
  }

  // ===== 板块折叠：筛子 / 关注清单 各自独立展开收起（状态记忆） =====
  function bindCollapse(sectionId, btnId, storageKey, defaultCollapsed) {
    const section = document.getElementById(sectionId);
    const btn = document.getElementById(btnId);
    if (!section || !btn) return;
    let collapsed = defaultCollapsed;
    try {
      const saved = localStorage.getItem(storageKey);
      if (saved === '1') collapsed = true;
      if (saved === '0') collapsed = false;
    } catch {}
    section.classList.toggle('collapsed', collapsed);
    btn.addEventListener('click', () => {
      const now = !section.classList.contains('collapsed');
      section.classList.toggle('collapsed', now);
      try { localStorage.setItem(storageKey, now ? '1' : '0'); } catch {}
    });
  }

  function trackRecordCount(track) {
    try {
      const raw = localStorage.getItem(TRACKS[track].keys.records);
      return raw ? JSON.parse(raw).length : 0;
    } catch { return 0; }
  }
  function updateSidebarCounts() {
    document.getElementById('sbCountCompany').textContent = trackRecordCount('company');
    document.getElementById('sbCountSoe').textContent = trackRecordCount('soe');
  }
  function updateTrackUI() {
    document.querySelectorAll('.sidebar .sb-track').forEach(btn => {
      btn.classList.toggle('is-active', btn.dataset.track === currentTrack);
    });
    const t = TRACKS[currentTrack];
    document.getElementById('trackChip').textContent = `${t.icon} ${t.name}`;
    const schedSel = document.getElementById('schedTrackSelect');
    if (schedSel) schedSel.value = currentTrack;
    updateSidebarCounts();
  }
  async function switchTrack(track) {
    if (track === currentTrack || !TRACKS[track]) return;
    currentTrack = track;
    try { localStorage.setItem(TRACK_KEY, track); } catch {}
    // 先切换高亮/徽章，再重渲染（即使渲染出错，侧边栏状态也不会卡住）
    updateTrackUI();
    // 换一套数据并整体重渲染（投递记录 / 关注清单 / 秋招筛子 / 日程规划）
    await loadRecords();
    await loadWatch();
    await loadSieve();
    await loadSchedule();
    renderWatchlist();
    renderSieve();
    renderSidebarSchedule();
    render();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
  // 视图切换：投递数据（各大企业/央国企） vs 日程规划，二者互斥、点击侧边栏打开
  function setView(v) {
    currentView = v;
    document.body.classList.toggle('view-schedule', v === 'schedule');
    const mainView = document.getElementById('mainTrackView');
    const schedView = document.getElementById('scheduleView');
    if (mainView) { mainView.classList.toggle('hidden', v === 'schedule'); mainView.style.display = v === 'schedule' ? 'none' : ''; }
    if (schedView) { schedView.classList.toggle('active', v === 'schedule'); schedView.style.display = v === 'schedule' ? 'block' : ''; }
    const schedSel = document.getElementById('schedTrackSelect');
    if (schedSel) schedSel.value = currentTrack;
    document.querySelectorAll('.sidebar .sb-track').forEach(b => {
      const isTrack = !!b.dataset.track;
      const active = isTrack ? (v === 'track' && b.dataset.track === currentTrack) : (v === 'schedule');
      b.classList.toggle('is-active', active);
    });
    if (v === 'schedule') renderSidebarSchedule();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
  // ===== 日程规划标题旁：赛道下拉框（自由切换，与侧边栏赛道联动）=====
  (function initSchedTrackSelect() {
    const sel = document.getElementById('schedTrackSelect');
    if (!sel) return;
    Object.keys(TRACKS).forEach(k => {
      const opt = document.createElement('option');
      opt.value = k;
      opt.textContent = `${TRACKS[k].icon} ${TRACKS[k].name}`;
      sel.appendChild(opt);
    });
    sel.value = currentTrack;
    sel.addEventListener('change', async () => {
      const v = sel.value;
      if (!TRACKS[v] || v === currentTrack) { sel.value = currentTrack; return; }
      sel.disabled = true;
      try {
        await switchTrack(v);
      } finally {
        sel.value = currentTrack;
        sel.disabled = false;
      }
      if (currentView === 'schedule') renderSidebarSchedule();
    });
  })();

  document.querySelectorAll('.sidebar .sb-track').forEach(btn => {
    btn.addEventListener('click', () => {
      if (btn.dataset.track) { switchTrack(btn.dataset.track); setView('track'); }
      else if (btn.dataset.view === 'schedule') { setView('schedule'); }
    });
  });

  // 侧边栏折叠/展开（记忆状态）
  const sbToggle = document.getElementById('sbToggle');
  const SB_COLLAPSED_KEY = 'autumn_recruit_sb_collapsed';
  function applySidebarCollapsed(collapsed) {
    document.body.classList.toggle('sb-collapsed', collapsed);
    sbToggle.textContent = collapsed ? '»' : '«';
    sbToggle.title = collapsed ? '展开侧边栏' : '折叠侧边栏';
    try { localStorage.setItem(SB_COLLAPSED_KEY, collapsed ? '1' : '0'); } catch {}
  }
  sbToggle.addEventListener('click', () => {
    applySidebarCollapsed(!document.body.classList.contains('sb-collapsed'));
  });

  // 云端同步状态徽标（仅提示，不参与逻辑）
  function showCloudBadge() {
    const b = document.createElement('div');
    b.id = 'cloudBadge';
    b.textContent = online.on ? '☁ 云端在线 · 自动同步' : '☁ 本地模式';
    b.title = online.on ? '数据存储在资料库，多设备自动同步' : '当前为本地文件：数据仅存于本浏览器（请通过资料库在线链接打开以启用云同步）';
    document.body.appendChild(b);
  }

  // ===== Init（异步：先拉取线上数据再渲染） =====
  async function boot() {
    // 恢复上次停留的赛道
    try {
      const savedTrack = localStorage.getItem(TRACK_KEY);
      if (savedTrack && TRACKS[savedTrack]) currentTrack = savedTrack;
    } catch {}
    await loadRecords();
    await loadWatch();
    await loadSieve();
    await loadSchedule();
    renderStatusKeyDots();
    renderWatchlist();
    renderSieve();
    renderSidebarSchedule();
    render();
    updateActiveNav();
    updateBackTop();
    updateTrackUI();
    // 侧边栏初始折叠状态：有记忆用记忆，小屏默认折叠为图标栏
    let sbPref = null;
    try { sbPref = localStorage.getItem(SB_COLLAPSED_KEY); } catch {}
    if (sbPref === null && window.innerWidth <= 640) sbPref = '1';
    applySidebarCollapsed(sbPref === '1');
    showCloudBadge();
  }
  boot();
})();</script>

</body>
